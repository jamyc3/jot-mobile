<!-- Vocabulary-adoption nudge in the keyboard's top-strip slot (§5.2c).
     Armed by the app when Vocabulary Boost is OFF and the user is high-intent
     (added terms that are going unused) or engaged (≥5 dictations); opt-in —
     Set up routes to the Vocabulary screen, nothing auto-enables. Priority
     warm-hold › vocab › Parakeet, one nudge at a time + a quiet day between
     any two; one-time, keyboard-only. Sits where the recents / streaming /
     warm-hold nudge sit; tapping Switch deep-links to the app's upgrade sheet.
     Twin of the warm-hold nudge — same Liquid Glass card. -->
<div style="height:300px"></div>

<!-- keyboard pane -->
<div style="background:var(--jot-card-bot);border-radius:24px 24px 0 0;padding:14px 12px 18px;margin:0 -6px">

  <!-- the vocabulary-nudge strip (glass card, 129pt) -->
  <div class="jot-card" style="margin:0 0 14px;padding:14px 14px 12px">
    <div style="font-size:15px;font-weight:600;color:var(--jot-ink);margin-bottom:5px">Get names &amp; jargon spelled right.</div>
    <div style="font-size:14px;color:var(--jot-ink-2);line-height:1.4;margin-bottom:14px">Turn on Vocabulary so Jot learns your words.</div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="height:38px;padding:0 20px;border-radius:999px;background:linear-gradient(#007AFF,var(--jot-accent-deep));display:inline-flex;align-items:center;color:#fff;font-size:15px;font-weight:600;box-shadow:0 0 16px rgba(26,140,255,0.35)">Set up</span>
      <span style="height:38px;padding:0 14px;display:inline-flex;align-items:center;color:var(--jot-ink-2);font-size:15px;font-weight:500">Not now</span>
    </div>
  </div>

  <!-- control row (idle) -->
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <span style="width:56px;height:54px;border-radius:11px;background:var(--jot-card-top);border:0.5px solid var(--jot-card-border);display:flex;align-items:center;justify-content:center;flex:none">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:var(--jot-ink)"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>
    </span>
    <div style="flex:1;height:54px;border-radius:13px;background:linear-gradient(var(--jot-accent),var(--jot-accent-deep));display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 18px rgba(26,140,255,0.35)">
      <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#fff"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11z"/></svg>
      <span style="color:#fff;font-size:18px;font-weight:600">Jot down</span>
    </div>
    <span style="width:72px;height:54px;border-radius:11px;background:rgba(120,120,128,0.28);display:flex;align-items:center;justify-content:center;flex:none">
      <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:none;stroke:var(--jot-ink);stroke-width:2"><path d="M20 7v4a3 3 0 01-3 3H6m0 0l4-4m-4 4l4 4"/></svg>
    </span>
  </div>

  <!-- bottom globe / mic row -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px 0">
    <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:none;stroke:var(--jot-ink);stroke-width:1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
    <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:var(--jot-ink)"><path d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11z"/></svg>
  </div>

</div>
